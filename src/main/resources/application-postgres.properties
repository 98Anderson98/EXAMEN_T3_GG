# ===================== PERFIL POSTGRESQL (Render / nube) =====================
# Se activa con la variable de entorno: SPRING_PROFILES_ACTIVE=postgres
# DB_URL debe tener formato JDBC:
#   jdbc:postgresql://HOST:5432/NOMBRE_BD
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_ecommerce_lariosanderson}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Pool pequeno (plan gratuito de Render)
spring.datasource.hikari.maximum-pool-size=5
