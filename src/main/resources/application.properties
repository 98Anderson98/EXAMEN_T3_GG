spring.application.name=be-ecommerce-lariosanderson
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_ecommerce_lariosanderson?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:clave-secreta-ecommerce-lariosanderson-2026-jwt-segura}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${CORS_ORIGINS:*}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
