spring.application.name=be-ecommerce-lariosanderson

# Puerto (Render inyecta la variable PORT)
server.port=${PORT:8080}

# ===================== BASE DE DATOS (MySQL por defecto) =====================
# Si existen variables de entorno (Docker / Render) se usan, si no los valores por defecto.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_ecommerce_lariosanderson?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root123}

# ===================== JPA / HIBERNATE =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================== JWT =====================
# Clave de minimo 32 caracteres (HS256). En produccion se pasa por variable JWT_SECRET.
jwt.secret=${JWT_SECRET:clave-secreta-ecommerce-lariosanderson-2026-jwt-segura}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# ===================== CORS =====================
# Origenes permitidos separados por coma (ej: http://localhost:4200,https://mi-front.com)
app.cors.allowed-origins=${CORS_ORIGINS:*}

# ===================== SWAGGER =====================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
